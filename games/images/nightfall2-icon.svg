<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Nightfall 2: Elf Town. Same night sky as the first game's mark, but the table of players
       is replaced by the town itself: rooftops, a bridge and a lit square. -->
  <rect width="96" height="96" fill="#05030a"/>
  <circle cx="18" cy="14" r="1.2" fill="#c7d2fe"/>
  <circle cx="40" cy="9" r="1" fill="#c7d2fe"/>
  <circle cx="84" cy="16" r="1.2" fill="#c7d2fe"/>
  <circle cx="10" cy="34" r="1" fill="#c7d2fe"/>
  <circle cx="88" cy="44" r="1" fill="#c7d2fe"/>

  <!-- crescent moon, mirroring the first icon -->
  <circle cx="62" cy="26" r="15" fill="#e0e7ff"/>
  <circle cx="68" cy="20" r="13" fill="#05030a"/>

  <!-- hills behind the town -->
  <path d="M0 62 Q24 48 48 60 Q72 72 96 58 L96 96 L0 96 Z" fill="#101a3a"/>

  <!-- rooftops -->
  <g stroke="#6366f1" stroke-width="2" stroke-linejoin="round">
    <path d="M12 72 L22 62 L32 72 L32 84 L12 84 Z" fill="#1e1b4b"/>
    <path d="M36 76 L46 64 L56 76 L56 86 L36 86 Z" fill="#241f57"/>
    <path d="M62 74 L72 65 L82 74 L82 84 L62 84 Z" fill="#1e1b4b"/>
  </g>

  <!-- lit windows: somebody is still awake -->
  <g fill="#fbbf24">
    <rect x="19" y="74" width="5" height="5" rx="1"/>
    <rect x="44" y="78" width="5" height="5" rx="1"/>
    <rect x="69" y="76" width="5" height="5" rx="1"/>
  </g>

  <!-- the bridge over the river that runs through the square -->
  <path d="M28 90 Q48 82 68 90" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- the number, small and in the corner -->
  <text x="86" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#e0e7ff" text-anchor="middle">2</text>
</svg>
