<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" shape-rendering="crispEdges">
  <rect width="96" height="96" fill="#060d12"/>
  <!-- four bars with a pale band behind each: the report's own shape, an estimate inside a range -->
  <g>
    <rect x="10" y="20" width="76" height="10" fill="#0e2a38"/>
    <rect x="10" y="38" width="76" height="10" fill="#0e2a38"/>
    <rect x="10" y="56" width="76" height="10" fill="#0e2a38"/>
    <rect x="10" y="74" width="76" height="10" fill="#0e2a38"/>
  </g>
  <g fill="#155e75">
    <rect x="34" y="20" width="40" height="10"/>
    <rect x="26" y="38" width="42" height="10"/>
    <rect x="18" y="56" width="40" height="10"/>
    <rect x="28" y="74" width="38" height="10"/>
  </g>
  <g fill="#67e8f9">
    <rect x="52" y="18" width="4" height="14"/>
    <rect x="46" y="36" width="4" height="14"/>
    <rect x="36" y="54" width="4" height="14"/>
    <rect x="46" y="72" width="4" height="14"/>
  </g>
  <!-- the flask: measured, not asked -->
  <g fill="#efe9dc">
    <rect x="42" y="4" width="12" height="4"/>
    <rect x="44" y="8" width="8" height="4"/>
  </g>
</svg>
